# ===================================================================
# Logistic Fleet Backend Configuration
# ===================================================================

server.port=8081

# Request timeouts - cap how long a request may take to 30 seconds so a
# stuck request doesn't hold a thread/connection open indefinitely. Kept in
# sync with the mobile/web client's 30s HTTP timeout.
spring.mvc.async.request-timeout=30000
server.tomcat.connection-timeout=30000

# Base64-encoded profile photos are sent as a plain JSON request body (no
# multipart), but Tomcat's default POST size cap still applies - raise it
# a bit so a phone-camera-sized avatar isn't rejected.
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB

spring.application.name=logisticfleet-backend

# ---------------------------------------------------------------
# Database (PostgreSQL) - update these to match your local setup
# ---------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/logisticfleet
spring.datasource.username=postgres
spring.datasource.password=sushil99
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------
# JPA / Hibernate
# schema.sql (in /database) is the source of truth for the schema,
# so ddl-auto is set to "validate" rather than "update"/"create".
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---------------------------------------------------------------
# JWT
# IMPORTANT: replace this secret with a long random value (32+ bytes)
# before deploying anywhere beyond your own machine.
# ---------------------------------------------------------------
logisticfleet.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_256_BITS_LONG
logisticfleet.jwt.expiration-ms=86400000

# ---------------------------------------------------------------
# CORS - allowed origins for the Flutter web build.
# Covers both "localhost" and "127.0.0.1" forms, plus the IPv6
# loopback form ([::1]) that Chrome sometimes uses for localhost.
# Add your deployed web app's origin here in production.
# ---------------------------------------------------------------
logisticfleet.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,http://[::1]:*

# ---------------------------------------------------------------
# MQTT - live GPS device telemetry.
# Point this at your broker. topic-pattern uses a single-level
# wildcard ("+") so one subscription covers every device, e.g.
# a device publishing to "fleet/TRK-104/telemetry" is matched by
# "fleet/+/telemetry". Leave broker-url blank to disable MQTT
# ingestion entirely (the app still starts fine without it).
# ---------------------------------------------------------------
mqtt.broker-url=tcp://localhost:1883
mqtt.client-id=logisticfleet-backend
mqtt.username=
mqtt.password=
mqtt.topic-pattern=fleet/+/telemetry
mqtt.enabled=false

# ---------------------------------------------------------------
# Firebase Cloud Messaging - push notifications.
# Download a service-account key from Firebase Console > Project
# Settings > Service Accounts > "Generate new private key", save it
# as src/main/resources/firebase-service-account.json (already
# gitignored), and set logisticfleet.firebase.enabled=true. The app
# starts fine with this off - notifications are just skipped.
# ---------------------------------------------------------------
logisticfleet.firebase.enabled=false
logisticfleet.firebase.credentials-path=classpath:firebase-service-account.json

# ---------------------------------------------------------------
# Mail (SMTP) - used to email the OTP for "Forgot password".
# Fill in a real SMTP account (e.g. a Gmail app password) and flip
# logisticfleet.mail.enabled=true to actually send emails. Left off, the
# app still starts fine - the OTP is simply logged to the console
# instead of emailed, so forgot-password still works end-to-end in
# local development without any SMTP setup.
# ---------------------------------------------------------------
logisticfleet.mail.enabled=false
logisticfleet.mail.from=no-reply@logisticfleet.app
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------
# Forgot-password OTP validity window, in minutes.
# ---------------------------------------------------------------
logisticfleet.otp.expiry-minutes=10